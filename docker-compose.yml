services:
  web:
    build: .
    image: mariemlogtar/counter-app:1.0
    ports:
      - "${WEB_PORT}:5000"
    environment:
      - REDIS_HOST=${REDIS_HOST}
    depends_on:
      - db-service
    networks:
      - app-network

  db-service:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - app-network

networks:
  app-network:

volumes:
  redis-data:
